services:
  valkey:
    build:
      context: .
      dockerfile: valkey.Dockerfile
    container_name: grchat-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  deno:
    build:
      context: ..
      dockerfile: containers/deno.Dockerfile
    container_name: grchat-deno
    ports:
      - "8000:8000"
    # environment:
    # Configuration can be overridden via environment variables
    # See CONFIG.md for complete list of available variables
    volumes:
      # Mount project directory (includes grchat.config.yaml)
      - ..:/app
      # Cache Deno dependencies
      - deno-cache:/deno-dir
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valkey-data:
  deno-cache:
