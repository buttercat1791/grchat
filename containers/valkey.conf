# Valkey Configuration for grchat
# Persistence: RDB only

################################## NETWORK #####################################
# Bind to all interfaces (Docker internal networking)
bind 0.0.0.0
protected-mode no
port 6379

################################## GENERAL #####################################
# Run as daemon in foreground (Docker best practice)
daemonize no

# Logging
loglevel notice
logfile ""

################################# SNAPSHOTTING ################################
# RDB Persistence Configuration
# Per architecture/DATABASE_SCHEMA.md requirements:
# - Save every 10 seconds if 100 keys change
# - Save every 60 seconds if 10 keys change
# - Save every 10 minutes if 1 key changes

save 10 100
save 60 10
save 600 1

# Stop accepting writes if RDB save fails (safety)
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory (matches Docker volume mount)
dir /data

################################# REPLICATION #################################
# No replication needed for single-instance deployment

################################## SECURITY ###################################
# No password required for internal Docker network
# requirepass foobared

################################### CLIENTS ###################################
# Max number of clients
# maxclients 10000

############################## MEMORY MANAGEMENT ##############################
# Max memory policy (optional, based on container limits)
# maxmemory <bytes>
# maxmemory-policy allkeys-lru

############################# LAZY FREEING ####################################
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

############################## APPEND ONLY MODE ###############################
# Disable AOF (using RDB only)
appendonly no

################################ LUA SCRIPTING  ###############################
lua-time-limit 5000

################################## SLOW LOG ###################################
slowlog-log-slower-than 10000
slowlog-max-len 128
